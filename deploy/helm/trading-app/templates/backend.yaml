apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {{- include "trading.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector: { app: backend }
  ports: [{ port: {{ .Values.backend.service.port | default .Values.backend.port }}, targetPort: {{ .Values.backend.port }} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {{- include "trading.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector: { matchLabels: { app: backend } }
  template:
    metadata:
      labels: { app: backend }
    spec:
      enableServiceLinks: false  # no auto *_PORT=tcp://... env vars
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.backend.port }} }]
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} }
          env:
            {{- include "trading.secretEnv" (dict "name" "POSTGRES_PASSWORD" "secret" .Values.secretName "key" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- include "trading.secretEnv" (dict "name" "S3_ACCESS_KEY" "secret" .Values.secretName "key" "MINIO_ROOT_USER") | nindent 12 }}
            {{- include "trading.secretEnv" (dict "name" "S3_SECRET_KEY" "secret" .Values.secretName "key" "MINIO_ROOT_PASSWORD") | nindent 12 }}
            # the app builds the database URL itself and URL-encodes the password
            - { name: POSTGRES_HOST, value: "postgres" }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - { name: S3_ENDPOINT_URL, value: "http://minio:9000" }
            - { name: S3_BUCKET, value: {{ .Values.minio.bucket | quote }} }
            - { name: SMTP_HOST, value: "mailhog" }
            - { name: SMTP_PORT, value: "1025" }
          readinessProbe:
            httpGet: { path: /health/ready, port: {{ .Values.backend.port }} }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: {{ .Values.backend.port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
