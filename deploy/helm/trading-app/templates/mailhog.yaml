{{- if .Values.mailhog.enabled }}
# Local-only fake mail server: emails land in the inbox at http://localhost:8025
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  labels: {{- include "trading.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mailhog.service.type }}
  selector: { app: mailhog }
  ports:
    - { name: smtp, port: 1025, targetPort: 1025 }
    - { name: ui, port: 8025, targetPort: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  labels: {{- include "trading.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app: mailhog } }
  template:
    metadata:
      labels: { app: mailhog }
    spec:
      enableServiceLinks: false  # no auto *_PORT=tcp://... env vars
      containers:
        - name: mailhog
          image: {{ .Values.mailhog.image }}
          ports: [{ containerPort: 1025 }, { containerPort: 8025 }]
{{- end }}
