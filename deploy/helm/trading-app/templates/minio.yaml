{{- if .Values.minio.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels: {{- include "trading.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: {{ .Values.minio.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels: {{- include "trading.labels" . | nindent 4 }}
spec:
  type: {{ .Values.minio.service.type }}
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels: {{- include "trading.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: minio } }
  template:
    metadata:
      labels: { app: minio }
    spec:
      enableServiceLinks: false  # no auto *_PORT=tcp://... env vars
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            {{- include "trading.secretEnv" (dict "name" "MINIO_ROOT_USER" "secret" .Values.secretName "key" "MINIO_ROOT_USER") | nindent 12 }}
            {{- include "trading.secretEnv" (dict "name" "MINIO_ROOT_PASSWORD" "secret" .Values.secretName "key" "MINIO_ROOT_PASSWORD") | nindent 12 }}
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 10
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
{{- end }}
